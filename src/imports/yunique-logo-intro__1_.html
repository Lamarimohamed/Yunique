<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YUNIQUE — logo intro</title>
<style>
  :root {
    --ink: #f5f5f0;
    --stage: #0a0a0a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--stage);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  .stage {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .mark-wrap {
    width: min(72vw, 620px);
    color: var(--ink);
    position: relative;
  }
  svg.mark { display: block; width: 100%; height: auto; overflow: visible; }

  svg.mark path {
    fill: currentColor;
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation-fill-mode: forwards;
    animation-timing-function: cubic-bezier(.16,.84,.32,1);
  }
  .p-top    { animation-name: ridgeInTop;    animation-duration: .62s; }
  .p-bottom { animation-name: ridgeInBottom; animation-duration: .62s; }
  .p-letter { animation-name: letterIn;      animation-duration: .55s; }

  @keyframes ridgeInTop {
    from { opacity: 0; transform: scale(1.07) translateY(-3%); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes ridgeInBottom {
    from { opacity: 0; transform: scale(1.07) translateY(3%); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes letterIn {
    from { opacity: 0; transform: translateY(10px) scale(.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .sweep {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  .sweep-bar {
    position: absolute; top: -20%; bottom: -20%; left: -35%;
    width: 30%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
    transform: translateX(-40%) skewX(-12deg);
    opacity: 0;
    animation: sweep 1.1s ease-out forwards;
    animation-delay: 1560ms;
    mix-blend-mode: screen;
  }
  @keyframes sweep {
    0%   { transform: translateX(-40%) skewX(-12deg); opacity: 0; }
    12%  { opacity: .9; }
    60%  { opacity: .35; }
    100% { transform: translateX(340%) skewX(-12deg); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    svg.mark path { animation: none !important; opacity: 1 !important; }
    .sweep-bar { display: none; }
  }

  .replay {
    position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    color: #8a8a86; background: transparent; border: 1px solid #3a3a38;
    padding: 8px 16px; border-radius: 999px; cursor: pointer;
  }
  .replay:hover { color: var(--ink); border-color: #6a6a66; }
</style>
</head>
